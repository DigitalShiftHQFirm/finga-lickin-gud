# Render deploy for Finga Lickin Gud.
# Free plan, NO persistent disk: on the free tier the SQLite database
# (menu edits, orders, admin login) resets when Render restarts or
# redeploys the service. That is the trade-off of the free plan — the
# menu and settings re-seed from the code on every fresh boot, and the
# owner re-runs first-time setup if the database is ever wiped.
# Move to a paid plan with a persistent disk (mountPath /var/data/flg
# + DATA_DIR=/var/data/flg) to keep orders and the admin login forever.
services:
  - type: web
    name: finga-lickin-gud
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24
      # Set this as a SECRET env var in the Render dashboard (never here):
      # SESSION_SECRET — signs the 30-day admin session cookies.
